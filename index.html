<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16a34a">
  <title>Nuestra Lista</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * { box-sizing: border-box; }
    :root { --green:#16a34a; --green-dark:#15803d; --green-soft:#dcfce7; --background:#f6f8f7; --card:#fff; --text:#18201c; --muted:#6b7280; --border:#e5e7eb; --danger:#dc2626; --yellow:#f59e0b; }
    body { margin:0; min-height:100vh; font-family:Arial,sans-serif; background:var(--background); color:var(--text); }
    header { background:linear-gradient(135deg,#15803d,#22c55e); color:white; padding:34px 20px 52px; text-align:center; }
    h1 { margin:0; font-size:31px; font-weight:800; }
    .subtitle { margin-top:7px; color:rgba(255,255,255,.9); font-size:15px; }
    main { max-width:650px; margin:-24px auto 40px; padding:0 14px; }
    .card { background:white; border-radius:18px; box-shadow:0 8px 28px rgba(0,0,0,.10); }
    #loginView { max-width:430px; margin:auto; padding:24px; }
    .login-title { margin:0 0 6px; text-align:center; }
    .login-text { text-align:center; color:var(--muted); font-size:14px; }
    .login-form { display:flex; flex-direction:column; gap:12px; margin-top:20px; }
    input { width:100%; padding:14px; border:1px solid var(--border); border-radius:12px; background:#f3f4f6; font-size:16px; outline:none; }
    input:focus { background:white; border-color:var(--green); box-shadow:0 0 0 2px var(--green-soft); }
    button { cursor:pointer; }
    .primary-button,.add-button { border:0; border-radius:12px; background:var(--green); color:white; font-weight:700; font-size:16px; padding:14px 17px; }
    .login-error { color:var(--danger); text-align:center; min-height:18px; margin-top:12px; font-size:14px; }
    #appView { display:none; }
    .user-bar { display:flex; justify-content:space-between; align-items:center; background:white; border-radius:14px; padding:11px 14px; margin-bottom:12px; box-shadow:0 3px 14px rgba(0,0,0,.06); }
    .user-email { color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .logout-button { border:0; background:transparent; color:var(--green-dark); font-weight:700; }
    .add-area { position:relative; margin-bottom:16px; }
    .add-box { display:flex; gap:8px; padding:9px; background:white; border-radius:18px; box-shadow:0 8px 28px rgba(0,0,0,.10); }
    .add-box input { border:0; min-width:0; }
    .voice-button { flex-shrink:0; width:48px; border:0; border-radius:12px; background:#eef7f0; font-size:22px; }
    .voice-button.listening { background:#fee2e2; }
    .voice-status { display:none; margin:7px 10px 0; color:var(--green-dark); font-size:12px; font-weight:700; }
    .suggestions { display:none; position:absolute; top:calc(100% + 5px); left:8px; right:8px; z-index:20; background:white; border-radius:14px; box-shadow:0 8px 25px rgba(0,0,0,.16); overflow-y:auto; max-height:240px; }
    .suggestion { padding:13px 15px; border-bottom:1px solid var(--border); font-size:15px; }
    .suggestion:last-child { border-bottom:0; }
    .summary { display:flex; justify-content:space-between; gap:8px; margin-bottom:18px; }
    .summary-card { flex:1; background:white; border-radius:14px; padding:12px 6px; text-align:center; box-shadow:0 3px 14px rgba(0,0,0,.05); }
    .summary-value { display:block; font-size:19px; font-weight:800; color:var(--green-dark); }
    .summary-label { font-size:11px; color:var(--muted); }
    .finish-area { margin:0 0 18px; }
    .finish-button { width:100%; border:0; border-radius:14px; padding:13px 16px; background:#166534; color:white; font-size:15px; font-weight:800; box-shadow:0 3px 14px rgba(0,0,0,.08); }
    .finish-button:disabled { opacity:.55; cursor:default; }
    .finish-help { margin-top:6px; text-align:center; color:var(--muted); font-size:11px; }
    .quick-section { display:none; margin-bottom:24px; }
    .quick-header { display:flex; justify-content:space-between; align-items:center; margin:0 4px 9px; }
    .quick-title { font-size:17px; font-weight:800; color:#374151; }
    .quick-subtitle { font-size:11px; color:var(--muted); }
    .quick-products { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; scrollbar-width:none; }
    .quick-products::-webkit-scrollbar { display:none; }
    .quick-product { flex:0 0 auto; max-width:180px; border:1px solid #bbf7d0; background:white; border-radius:14px; padding:10px 12px; box-shadow:0 2px 10px rgba(0,0,0,.05); }
    .quick-name { display:block; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:700; color:#374151; }
    .quick-meta { display:block; margin-top:4px; color:var(--green-dark); font-size:11px; font-weight:700; }
    .category { margin-bottom:22px; }
    .category-title { margin:0 0 9px 5px; font-size:17px; font-weight:800; color:#374151; }
    .list { background:white; border-radius:18px; padding:5px 12px; box-shadow:0 3px 16px rgba(0,0,0,.06); }
    .item { display:flex; align-items:center; gap:9px; min-height:67px; padding:9px 2px; border-bottom:1px solid var(--border); }
    .item:last-child { border-bottom:0; }
    .check-button { flex-shrink:0; width:34px; height:34px; border:2px solid #d1d5db; border-radius:50%; background:white; color:white; font-size:18px; font-weight:bold; }
    .item.checked .check-button { background:var(--green); border-color:var(--green); }
    .product-info { flex:1; min-width:0; }
    .product-name { font-size:16px; font-weight:600; word-break:break-word; }
    .completed { text-decoration:line-through; color:#9ca3af; }
    .product-meta { margin-top:5px; color:var(--muted); font-size:11px; }
    .controls { display:flex; align-items:center; gap:4px; margin-top:7px; flex-wrap:wrap; }
    .qty-button { width:28px; height:28px; padding:0; border:0; border-radius:8px; background:var(--green-soft); color:var(--green-dark); font-size:18px; font-weight:bold; }
    .quantity { min-width:31px; text-align:center; font-size:14px; font-weight:700; }
    .price-button { border:0; border-radius:8px; padding:6px 8px; background:#f3f4f6; color:#4b5563; font-size:12px; }
    .favorite-button,.delete-button { flex-shrink:0; border:0; background:transparent; padding:7px 4px; font-size:19px; }
    .favorite-button { color:#d1d5db; }
    .favorite-button.active { color:var(--yellow); }
    .delete-button { color:#9ca3af; }
    .empty,.loading { padding:40px 10px; text-align:center; color:var(--muted); }

    .supermarket-section { margin-bottom:24px; }
    .supermarket-title { margin:0 0 9px 5px; font-size:18px; font-weight:800; color:var(--green-dark); }
    .supermarket-select { border:0; border-radius:8px; padding:6px 7px; background:#eef7f0; color:#374151; font-size:12px; max-width:145px; }
    @media(max-width:480px) { header { padding-top:29px; } h1 { font-size:29px; } main { padding:0 11px; } }
  </style>
</head>
<body>
<header><h1>🛒 Nuestra Lista</h1><div class="subtitle">La compra, juntos y sin olvidos.</div></header>
<main>
<section id="loginView" class="card">
<h2 class="login-title">Bienvenido 👋</h2><p class="login-text">Inicia sesión para acceder a vuestra lista compartida.</p>
<div class="login-form">
<input type="email" id="emailInput" placeholder="Correo electrónico" autocomplete="email">
<input type="password" id="passwordInput" placeholder="Contraseña" autocomplete="current-password" onkeydown="handleLoginKey(event)">
<button id="loginButton" class="primary-button" onclick="login()">Iniciar sesión</button>
</div><div id="loginError" class="login-error"></div>
</section>
<section id="appView">
<div class="user-bar"><span id="userEmail" class="user-email"></span><button class="logout-button" onclick="logout()">Cerrar sesión</button></div>
<div class="add-area"><div class="add-box">
<input type="text" id="productInput" placeholder="¿Qué necesitamos?" autocomplete="off" oninput="showSuggestions()" onkeydown="handleProductKey(event)">
<button id="voiceButton" class="voice-button" onclick="startVoiceInput()" aria-label="Añadir por voz">🎙️</button>
<button class="add-button" onclick="addProduct()">Añadir</button>
</div><div id="voiceStatus" class="voice-status"></div><div id="suggestions" class="suggestions"></div></div>
<div class="summary">
<div class="summary-card"><span id="pendingCount" class="summary-value">0</span><span class="summary-label">Pendientes</span></div>
<div class="summary-card"><span id="favoriteCount" class="summary-value">0</span><span class="summary-label">Favoritos</span></div>
<div class="summary-card"><span id="estimatedTotal" class="summary-value">0,00 €</span><span class="summary-label">Estimado</span></div>
</div>
<div class="finish-area">
  <button id="finishButton" class="finish-button" onclick="finishPurchase()">🧾 Finalizar compra</button>
  <div class="finish-help">Guarda en el historial y retira los productos marcados ✓</div>
</div>
<section id="quickSection" class="quick-section"><div class="quick-header"><span class="quick-title">⭐ Habituales</span><span class="quick-subtitle">Toca para añadir</span></div><div id="quickProducts" class="quick-products"></div></section>
<div id="shoppingList"><div class="list"><div class="loading">Cargando lista...</div></div></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://hnytuqklpuhiqeapkykx.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZcuVEC6cwbsS8kkop6oLxw_f6XVDtgN";
const LIST_ID = "59d10737-51e8-4edf-9217-63e25a5f4a6b";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let products = [], currentUser = null, learnedProducts = [];

const basicProducts = ["Leche","Pan","Huevos","Agua","Tomate","Patatas","Cebolla","Lechuga","Fresas","Manzanas","Plátanos","Naranjas","Peras","Limón","Aguacate","Pimiento","Pepino","Calabacín","Pollo","Carne","Salmón","Atún","Yogur","Queso","Mantequilla","Arroz","Pasta","Café","Azúcar","Aceite","Sal","Coca-Cola","Zumo","Papel higiénico","Detergente","Suavizante","Lavavajillas"];

const categoryOrder = ["🍎 Fruta y verdura","🥛 Lácteos","🥩 Carnicería","🐟 Pescadería","🥖 Panadería","🥫 Despensa","🥤 Bebidas","🧽 Limpieza y hogar","🛍️ Otros"];
const supermarkets = ["Sin asignar","Supercarmela","Cash Silva","DIA","Mercadona","Covirán","Lidl","Carrefour","Aldi"];

function getCategory(product) {
 const text=(product||"").toLowerCase();
 if(["leche","yogur","yogurt","queso","mantequilla","nata","kéfir","kefir"].some(x=>text.includes(x))) return "🥛 Lácteos";
 if(["pollo","carne","ternera","cerdo","hamburguesa","salchicha","pavo","chorizo","jamón","jamon","lomo"].some(x=>text.includes(x))) return "🥩 Carnicería";
 if(["pescado","atún","atun","salmón","salmon","gamba","marisco","merluza","bacalao","calamar","sepia","langostino"].some(x=>text.includes(x))) return "🐟 Pescadería";
 if(["fresa","manzana","plátano","platano","naranja","pera","tomate","lechuga","patata","cebolla","zanahoria","limón","limon","mandarina","melón","melon","sandía","sandia","uva","kiwi","aguacate","pimiento","pepino","calabacín","calabacin","berenjena","ajo","brócoli","brocoli","espinaca","champiñón","champinon"].some(x=>text.includes(x))) return "🍎 Fruta y verdura";
 if(["pan","barra","croissant","magdalena","mollete","tostada"].some(x=>text.includes(x))) return "🥖 Panadería";
 if(["agua","coca","refresco","zumo","cerveza","batido"].some(x=>text.includes(x))) return "🥤 Bebidas";
 if(["detergente","lejía","lejia","lavavajillas","suavizante","limpiador","papel higiénico","papel higienico","servilleta","bolsa basura","estropajo","esponja"].some(x=>text.includes(x))) return "🧽 Limpieza y hogar";
 if(["arroz","pasta","aceite","sal","azúcar","azucar","café","cafe","harina","lenteja","garbanzo","judía","judia","galleta","cereal","conserva"].some(x=>text.includes(x))) return "🥫 Despensa";
 return "🛍️ Otros";
}
function escapeHtml(text){const d=document.createElement("div");d.textContent=text||"";return d.innerHTML;}
function normalizeName(text){return(text||"").trim().toLowerCase();}
function showLogin(){document.getElementById("loginView").style.display="block";document.getElementById("appView").style.display="none";}
function showApp(user){currentUser=user;document.getElementById("loginView").style.display="none";document.getElementById("appView").style.display="block";document.getElementById("userEmail").textContent=user.email||"";}

async function login(){
 const emailInput=document.getElementById("emailInput"), passwordInput=document.getElementById("passwordInput"), loginButton=document.getElementById("loginButton"), errorBox=document.getElementById("loginError");
 const email=emailInput.value.trim(),password=passwordInput.value;errorBox.textContent="";
 if(!email||!password){errorBox.textContent="Introduce tu correo y contraseña.";return;}
 loginButton.disabled=true;loginButton.textContent="Entrando...";
 const{data,error}=await supabaseClient.auth.signInWithPassword({email,password});
 loginButton.disabled=false;loginButton.textContent="Iniciar sesión";
 if(error){console.error(error);errorBox.textContent="No se ha podido iniciar sesión. Revisa el correo y la contraseña.";return;}
 passwordInput.value="";showApp(data.user);await Promise.all([loadProducts(),loadLearnedProducts()]);renderQuickProducts();
}
async function logout(){await supabaseClient.auth.signOut();products=[];learnedProducts=[];currentUser=null;showLogin();}

async function loadProducts(){
 const list=document.getElementById("shoppingList");
 const{data,error}=await supabaseClient.from("Productos").select("id, Nombre, Cantidad, Categoria, Comprado, list_id, added_by, price, favorite, supermarket").eq("list_id",LIST_ID);
 if(error){console.error("Error cargando productos:",error);list.innerHTML='<div class="list"><div class="empty">No se ha podido cargar la lista.</div></div>';return;}
 products=(data||[]).map((p,position)=>({id:p.id,name:p.Nombre,quantity:p.Cantidad||1,completed:!!p.Comprado,addedBy:p.added_by,price:Number(p.price)||0,favorite:!!p.favorite,supermarket:p.supermarket||"",position}));
 // Orden determinista: categoría, nombre e id. Así las recargas no hacen "bailar" las filas.
 products.sort((a,b)=>{
   const ca=categoryOrder.indexOf(getCategory(a.name)), cb=categoryOrder.indexOf(getCategory(b.name));
   if(ca!==cb)return ca-cb;
   const byName=(a.name||"").localeCompare(b.name||"","es",{sensitivity:"base"});
   if(byName!==0)return byName;
   return String(a.id).localeCompare(String(b.id));
 });
 renderList();renderQuickProducts();
}

async function loadLearnedProducts(){
 const{data,error}=await supabaseClient.from("product_history").select("product_name, times_added").eq("list_id",LIST_ID).order("times_added",{ascending:false}).limit(40);
 if(error){console.error("Error cargando habituales:",error);learnedProducts=[];renderQuickProducts();return;}
 learnedProducts=data||[];renderQuickProducts();
}
function updateSummary(){
 const pending=products.filter(p=>!p.completed).length,favorites=products.filter(p=>p.favorite).length;
 const total=products.reduce((s,p)=>s+((Number(p.price)||0)*p.quantity),0);
 document.getElementById("pendingCount").textContent=pending;document.getElementById("favoriteCount").textContent=favorites;
 document.getElementById("estimatedTotal").textContent=total.toLocaleString("es-ES",{style:"currency",currency:"EUR"});
}
function getQuickProducts(){
 const m=new Map();
 learnedProducts.forEach(item=>{const name=(item.product_name||"").trim();if(!name)return;const key=normalizeName(name),times=Number(item.times_added)||0,current=m.get(key);if(!current)m.set(key,{name,times,favorite:false});else current.times+=times;});
 products.forEach(p=>{if(!p.favorite)return;const key=normalizeName(p.name);if(!m.has(key))m.set(key,{name:p.name,times:0,favorite:true});else m.get(key).favorite=true;});
 return[...m.values()].sort((a,b)=>{if(a.favorite!==b.favorite)return Number(b.favorite)-Number(a.favorite);if(b.times!==a.times)return b.times-a.times;return a.name.localeCompare(b.name,"es");}).slice(0,10);
}
function renderQuickProducts(){
 const section=document.getElementById("quickSection"),container=document.getElementById("quickProducts");if(!section||!container)return;
 const quick=getQuickProducts();if(!quick.length){section.style.display="none";container.innerHTML="";return;}
 section.style.display="block";container.innerHTML="";
 quick.forEach(item=>{const button=document.createElement("button");button.className="quick-product";const meta=item.favorite?"★ Favorito · + Añadir":item.times>1?`${item.times} veces · + Añadir`:"+ Añadir";
 button.innerHTML=`<span class="quick-name">${escapeHtml(item.name)}</span><span class="quick-meta">${escapeHtml(meta)}</span>`;button.onclick=()=>addQuickProduct(item.name);container.appendChild(button);});
}
function renderList(){
 const list=document.getElementById("shoppingList");list.innerHTML="";updateSummary();
 if(!products.length){list.innerHTML='<div class="list"><div class="empty">Tu lista está vacía 🛒</div></div>';return;}

 // Primero agrupamos por supermercado y, dentro de cada uno, por categoría.
 const groups={};
 products.forEach((product,index)=>{
   const supermarket=(product.supermarket||"").trim()||"Sin asignar";
   const category=getCategory(product.name);
   if(!groups[supermarket])groups[supermarket]={};
   if(!groups[supermarket][category])groups[supermarket][category]=[];
   groups[supermarket][category].push({product,index});
 });

 const supermarketOrder=[...supermarkets,...Object.keys(groups).filter(x=>!supermarkets.includes(x))];

 supermarketOrder.filter(s=>groups[s]).forEach(supermarket=>{
   const supermarketBox=document.createElement("section");
   supermarketBox.className="supermarket-section";
   supermarketBox.innerHTML=`<div class="supermarket-title">🏪 ${escapeHtml(supermarket)}</div>`;
   const categoryGroups=groups[supermarket];

   categoryOrder.filter(c=>categoryGroups[c]).forEach(category=>{
     const box=document.createElement("div");box.className="category";
     box.innerHTML=`<div class="category-title">${category}</div><div class="list"></div>`;
     const categoryList=box.querySelector(".list");

     categoryGroups[category].forEach(({product,index})=>{
       const item=document.createElement("div");item.className="item"+(product.completed?" checked":"");
       let addedText="";
       if(product.addedBy)addedText=product.addedBy===currentUser?.id?"Añadido por ti":"Añadido por otro miembro";
       const priceText=product.price>0?`${product.price.toFixed(2).replace(".",",")} € ud.`:"Añadir precio";
       const selectedSupermarket=(product.supermarket||"").trim()||"Sin asignar";
       const supermarketOptions=supermarkets.map(name=>`<option value="${escapeHtml(name)}" ${name===selectedSupermarket?"selected":""}>${escapeHtml(name)}</option>`).join("");

       item.innerHTML=`<button class="check-button" onclick="toggleProduct(${index})">${product.completed?"✓":""}</button>
       <div class="product-info">
         <div class="product-name ${product.completed?"completed":""}">${escapeHtml(product.name)}</div>
         <div class="product-meta">${escapeHtml(addedText)}</div>
         <div class="controls">
           <button class="qty-button" onclick="changeQuantity(${index},-1)">−</button>
           <span class="quantity">×${product.quantity}</span>
           <button class="qty-button" onclick="changeQuantity(${index},1)">+</button>
           <button class="price-button" onclick="setPrice(${index})">${priceText}</button>
           <select class="supermarket-select" onchange="setSupermarket(${index},this.value)">${supermarketOptions}</select>
         </div>
       </div>
       <button class="favorite-button ${product.favorite?"active":""}" onclick="toggleFavorite(${index})" aria-label="Favorito">★</button>
       <button class="delete-button" onclick="deleteProduct(${index})" aria-label="Borrar">🗑️</button>`;
       categoryList.appendChild(item);
     });
     supermarketBox.appendChild(box);
   });
   list.appendChild(supermarketBox);
 });
}
function showSuggestions(){
 const input=document.getElementById("productInput"),box=document.getElementById("suggestions"),search=input.value.trim().toLowerCase();
 if(!search){box.style.display="none";return;}
 const all=[...new Set([...learnedProducts.map(x=>x.product_name),...products.map(x=>x.name),...basicProducts])];
 const matches=all.filter(name=>name&&name.toLowerCase().includes(search)&&name.toLowerCase()!==search).slice(0,6);
 if(!matches.length){box.style.display="none";return;}box.innerHTML="";
 matches.forEach(name=>{const row=document.createElement("div");row.className="suggestion";row.textContent=name;row.onclick=()=>{input.value=name;box.style.display="none";input.focus();};box.appendChild(row);});box.style.display="block";
}
async function learnProduct(name){
 if(!currentUser)return;const normalized=name.trim();
 const{data,error}=await supabaseClient.from("product_history").select("id, times_added").eq("list_id",LIST_ID).eq("user_id",currentUser.id).ilike("product_name",normalized).maybeSingle();
 if(error){console.error("Error buscando habitual:",error);return;}
 if(data)await supabaseClient.from("product_history").update({times_added:(data.times_added||1)+1,last_added_at:new Date().toISOString()}).eq("id",data.id);
 else await supabaseClient.from("product_history").insert({user_id:currentUser.id,list_id:LIST_ID,product_name:normalized,category:getCategory(normalized),times_added:1});
 await loadLearnedProducts();
}
async function insertProduct(name){
 if(!name||!currentUser)return false;
 const{error}=await supabaseClient.from("Productos").insert({Nombre:name,Cantidad:1,Categoria:getCategory(name),Comprado:false,list_id:LIST_ID,added_by:currentUser.id,favorite:false});
 if(error){console.error("Error añadiendo producto:",error);alert("No se pudo añadir el producto.");return false;}await learnProduct(name);return true;
}
// NUEVO: si el producto ya está pendiente, no duplica fila; suma una unidad.
async function addOrIncreaseProduct(name){
 const existing=products.find(p=>normalizeName(p.name)===normalizeName(name)&&!p.completed);
 if(existing){
   const{error}=await supabaseClient.from("Productos").update({Cantidad:existing.quantity+1}).eq("id",existing.id).eq("list_id",LIST_ID);
   if(error){console.error("Error aumentando producto:",error);alert("No se pudo actualizar el producto.");return false;}
   await learnProduct(name);return true;
 }
 return await insertProduct(name);
}
async function addProduct(){
 const input=document.getElementById("productInput"),name=input.value.trim();if(!name)return;
 const ok=await addOrIncreaseProduct(name);if(!ok)return;input.value="";document.getElementById("suggestions").style.display="none";input.focus();await loadProducts();
}
async function addQuickProduct(name){if(!name)return;const ok=await addOrIncreaseProduct(name);if(ok)await loadProducts();}
async function changeQuantity(index,change){
 const p=products[index];if(!p)return;const q=Math.max(1,p.quantity+change);
 const{error}=await supabaseClient.from("Productos").update({Cantidad:q}).eq("id",p.id).eq("list_id",LIST_ID);
 if(!error){p.quantity=q;renderList();}else console.error("Error cambiando cantidad:",error);
}
async function toggleProduct(index){
 const p=products[index];if(!p)return;const value=!p.completed;
 const{error}=await supabaseClient.from("Productos").update({Comprado:value}).eq("id",p.id).eq("list_id",LIST_ID);
 if(!error){p.completed=value;renderList();}else console.error(error);
}
async function toggleFavorite(index){
 const p=products[index];if(!p)return;const value=!p.favorite;
 const{error}=await supabaseClient.from("Productos").update({favorite:value}).eq("id",p.id).eq("list_id",LIST_ID);
 if(!error){p.favorite=value;renderList();renderQuickProducts();}else console.error(error);
}
async function setSupermarket(index,value){
 const p=products[index];if(!p)return;
 const supermarket=value==="Sin asignar"?"":value;
 const{error}=await supabaseClient.from("Productos").update({supermarket}).eq("id",p.id).eq("list_id",LIST_ID);
 if(!error){p.supermarket=supermarket;renderList();}else{console.error("Error cambiando supermercado:",error);alert("No se pudo cambiar el supermercado.");}
}
async function setPrice(index){
 const p=products[index];if(!p)return;const current=p.price>0?p.price.toString().replace(".",","):"";const value=prompt(`Precio por unidad de ${p.name}:`,current);if(value===null)return;
 const normalized=Number(value.replace(",","."));if(Number.isNaN(normalized)||normalized<0){alert("Introduce un precio válido.");return;}
 const{error}=await supabaseClient.from("Productos").update({price:normalized}).eq("id",p.id).eq("list_id",LIST_ID);
 if(!error){p.price=normalized;renderList();}else console.error(error);
}
async function deleteProduct(index){const p=products[index];if(!p)return;const{error}=await supabaseClient.from("Productos").delete().eq("id",p.id).eq("list_id",LIST_ID);if(!error)await loadProducts();}


async function finishPurchase(){
 if(!currentUser)return;
 const bought=products.filter(p=>p.completed);
 if(!bought.length){
   alert("Marca con ✓ los productos comprados antes de finalizar la compra.");
   return;
 }
 const total=bought.reduce((sum,p)=>sum+((Number(p.price)||0)*p.quantity),0);
 const totalText=total.toLocaleString("es-ES",{style:"currency",currency:"EUR"});
 const ok=confirm(`Vas a finalizar ${bought.length} producto${bought.length===1?"":"s"} por un total registrado de ${totalText}.\n\nSe guardarán en el historial y se quitarán de la lista.\n\n¿Continuar?`);
 if(!ok)return;

 const button=document.getElementById("finishButton");
 button.disabled=true;
 button.textContent="Guardando compra...";

 const historyRows=bought.map(p=>({
   list_id:LIST_ID,
   user_id:currentUser.id,
   product_name:p.name,
   quantity:p.quantity,
   price:Number(p.price)||0,
   supermarket:p.supermarket||"",
   category:getCategory(p.name),
   purchased_at:new Date().toISOString()
 }));

 const{error:historyError}=await supabaseClient.from("purchase_history").insert(historyRows);
 if(historyError){
   console.error("Error guardando historial:",historyError);
   alert("ERROR SUPABASE:\n" + (historyError.message || JSON.stringify(historyError)));
   button.disabled=false;
   button.textContent="🧾 Finalizar compra";
   return;
 }

 const ids=bought.map(p=>p.id);
 const{error:deleteError}=await supabaseClient.from("Productos").delete().in("id",ids).eq("list_id",LIST_ID);

 if(deleteError){
   console.error("Error retirando productos:",deleteError);
   alert("La compra se guardó en el historial, pero no se pudieron retirar algunos productos de la lista.");
 }else{
   alert("Compra finalizada y guardada en el historial 🧾");
 }

 button.disabled=false;
 button.textContent="🧾 Finalizar compra";
 await loadProducts();
}

function splitVoiceProducts(text){
 let clean=(text||"").trim();
 // Convierte "y" en separador y admite comas.
 clean=clean.replace(/\s+y\s+/gi,",");
 return clean.split(",").map(x=>x.trim()).filter(Boolean);
}
function parseVoiceItem(text){
 let item=text.trim();
 let quantity=1;
 const numberWords={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10};
 const match=item.match(/^(?:(\d+)|([a-záéíóúñ]+))\s+(.+)$/i);
 if(match){
   const q=match[1]?Number(match[1]):numberWords[(match[2]||"").toLowerCase()];
   if(q){quantity=q;item=match[3].trim();}
 }
 return {name:item,quantity};
}
async function addVoiceProduct(name,quantity){
 if(!name||quantity<1)return;
 const existing=products.find(p=>normalizeName(p.name)===normalizeName(name)&&!p.completed);
 if(existing){
   const newQuantity=existing.quantity+quantity;
   const{error}=await supabaseClient.from("Productos").update({Cantidad:newQuantity}).eq("id",existing.id).eq("list_id",LIST_ID);
   if(!error)await learnProduct(name);
   return;
 }
 const ok=await insertProduct(name);
 if(!ok)return;
 if(quantity>1){
   // Localizamos el recién creado para fijar la cantidad pedida.
   const{data}=await supabaseClient.from("Productos").select("id").eq("list_id",LIST_ID).ilike("Nombre",name).eq("Comprado",false).order("id",{ascending:false}).limit(1);
   if(data&&data[0])await supabaseClient.from("Productos").update({Cantidad:quantity}).eq("id",data[0].id);
 }
}
async function processVoiceText(text){
 const parts=splitVoiceProducts(text);
 if(!parts.length)return;
 const status=document.getElementById("voiceStatus");
 status.style.display="block";
 status.textContent=`Añadiendo ${parts.length} producto${parts.length===1?"":"s"}...`;
 for(const part of parts){
   const parsed=parseVoiceItem(part);
   await addVoiceProduct(parsed.name,parsed.quantity);
 }
 await loadProducts();
 status.textContent="✓ Añadido por voz";
 setTimeout(()=>{status.style.display="none";},1800);
}
function startVoiceInput(){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
   alert("El reconocimiento de voz no está disponible en este navegador. Prueba con Chrome en Android.");
   return;
 }
 const recognition=new SpeechRecognition();
 recognition.lang="es-ES";
 recognition.interimResults=false;
 recognition.maxAlternatives=1;
 const button=document.getElementById("voiceButton");
 const status=document.getElementById("voiceStatus");
 button.classList.add("listening");
 status.style.display="block";
 status.textContent="🎙️ Escuchando... Di varios productos separados por “y”.";
 recognition.onresult=event=>{
   const text=event.results[0][0].transcript;
   status.textContent=`He oído: ${text}`;
   processVoiceText(text);
 };
 recognition.onerror=event=>{
   console.error("Error de voz:",event.error);
   status.textContent="No te he entendido. Prueba otra vez.";
   setTimeout(()=>{status.style.display="none";},1800);
 };
 recognition.onend=()=>button.classList.remove("listening");
 recognition.start();
}

function handleLoginKey(event){if(event.key==="Enter")login();}
function handleProductKey(event){if(event.key==="Enter"){document.getElementById("suggestions").style.display="none";addProduct();}}
async function startApp(){
 const{data:{session}}=await supabaseClient.auth.getSession();
 if(session&&session.user){showApp(session.user);await Promise.all([loadProducts(),loadLearnedProducts()]);renderQuickProducts();}else showLogin();
}
supabaseClient.channel("productos-realtime").on("postgres_changes",{event:"*",schema:"public",table:"Productos",filter:`list_id=eq.${LIST_ID}`},()=>loadProducts()).subscribe();
supabaseClient.auth.onAuthStateChange(event=>{if(event==="SIGNED_OUT"){products=[];learnedProducts=[];currentUser=null;showLogin();}});
document.addEventListener("click",event=>{const area=document.querySelector(".add-area");if(area&&!area.contains(event.target))document.getElementById("suggestions").style.display="none";});
startApp();
</script>
