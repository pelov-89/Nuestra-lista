<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Lista</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: white;
      padding: 28px 20px 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      margin-top: 8px;
      color: #666;
      font-size: 15px;
    }

    main {
      max-width: 650px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .add-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #222;
    }

    .add-button {
      border: none;
      border-radius: 10px;
      padding: 14px 18px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .category {
      margin-bottom: 18px;
    }

    .category-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
      padding-left: 5px;
    }

    .list {
      background: white;
      border-radius: 15px;
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 30px 10px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 10px;
      border-bottom: 1px solid #eee;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item span {
      flex: 1;
      font-size: 17px;
    }

    .check-button {
      border: none;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      background: #eee;
      color: #333;
      cursor: pointer;
      font-size: 18px;
    }

    .delete-button {
      border: none;
      background: transparent;
      color: #999;
      cursor: pointer;
      font-size: 18px;
    }

    .completed {
      text-decoration: line-through;
      color: #999;
    }

    .category-name {
      color: #555;
      font-size: 13px;
      margin-left: 5px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛒 Nuestra Lista</h1>
    <div class="subtitle">La compra, juntos y sin olvidos.</div>
  </header>

  <main>

    <div class="add-box">
      <input
        type="text"
        id="productInput"
        placeholder="¿Qué necesitamos?"
        onkeydown="handleKey(event)"
      >

      <button class="add-button" onclick="addProduct()">
        Añadir
      </button>
    </div>

    <div id="shoppingList"></div>

  </main>

  <script>
    let products = JSON.parse(localStorage.getItem("nuestraLista")) || [];

    function getCategory(product) {
      const text = product.toLowerCase();

      if (
        text.includes("leche") ||
        text.includes("yogur") ||
        text.includes("yogurt") ||
        text.includes("queso") ||
        text.includes("mantequilla") ||
        text.includes("nata")
      ) {
        return "🥛 Lácteos";
      }

      if (
        text.includes("pollo") ||
        text.includes("carne") ||
        text.includes("ternera") ||
        text.includes("cerdo") ||
        text.includes("hamburguesa") ||
        text.includes("salchicha")
      ) {
        return "🥩 Carnicería";
      }

      if (
        text.includes("pescado") ||
        text.includes("atún") ||
        text.includes("atun") ||
        text.includes("salmón") ||
        text.includes("salmon") ||
        text.includes("gamba") ||
        text.includes("marisco")
      ) {
        return "🐟 Pescadería";
      }

      if (
        text.includes("manzana") ||
        text.includes("plátano") ||
        text.includes("platano") ||
        text.includes("naranja") ||
        text.includes("pera") ||
        text.includes("tomate") ||
        text.includes("lechuga") ||
        text.includes("patata") ||
        text.includes("cebolla") ||
        text.includes("zanahoria")
      ) {
        return "🍎 Fruta y verdura";
      }

      if (
        text.includes("pan") ||
        text.includes("barra") ||
        text.includes("croissant") ||
        text.includes("magdalena")
      ) {
        return "🥖 Panadería";
      }

      if (
        text.includes("agua") ||
        text.includes("coca") ||
        text.includes("refresco") ||
        text.includes("zumo") ||
        text.includes("cerveza")
      ) {
        return "🥤 Bebidas";
      }

      if (
        text.includes("detergente") ||
        text.includes("lejía") ||
        text.includes("lejia") ||
        text.includes("lavavajillas") ||
        text.includes("suavizante") ||
        text.includes("limpiador") ||
        text.includes("papel higiénico") ||
        text.includes("papel higienico")
      ) {
        return "🧽 Limpieza y hogar";
      }

      return "🛍️ Otros";
    }

    function saveProducts() {
      localStorage.setItem("nuestraLista", JSON.stringify(products));
    }

    function renderList() {
      const list = document.getElementById("shoppingList");

      list.innerHTML = "";

      if (products.length === 0) {
        list.innerHTML = `
          <div class="list">
            <div class="empty">
              Tu lista está vacía 🛒
            </div>
          </div>
        `;
        return;
      }

      const categories = {};

      products.forEach((product, index) => {
        const category = getCategory(product.name);

        if (!categories[category]) {
          categories[category] = [];
        }

        categories[category].push({
          product,
          index
        });
      });

      Object.keys(categories).forEach(category => {

        const categoryBox = document.createElement("div");
        categoryBox.className = "category";

        categoryBox.innerHTML = `
          <div class="category-title">
            ${category}
          </div>
          <div class="list"></div>
        `;

        const categoryList = categoryBox.querySelector(".list");

        categories[category].forEach(({ product, index }) => {

          const item = document.createElement("div");
          item.className = "item";

          item.innerHTML = `
            <button class="check-button" onclick="toggleProduct(${index})">
              ${product.completed ? "✓" : ""}
            </button>

            <span class="${product.completed ? "completed" : ""}">
              ${escapeHtml(product.name)}
            </span>

            <button class="delete-button" onclick="deleteProduct(${index})">
              🗑️
            </button>
          `;

          categoryList.appendChild(item);
        });

        list.appendChild(categoryBox);
      });
    }

    function addProduct() {
      const input = document.getElementById("productInput");
      const name = input.value.trim();

      if (name === "") {
        return;
      }

      products.push({
        name: name,
        completed: false
      });

      saveProducts();
      renderList();

      input.value = "";
      input.focus();
    }

    function toggleProduct(index) {
      products[index].completed = !products[index].completed;

      saveProducts();
      renderList();
    }

    function deleteProduct(index) {
      products.splice(index, 1);

      saveProducts();
      renderList();
    }

    function handleKey(event) {
      if (event.key === "Enter") {
        addProduct();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    renderList();
  </script>

</body>
</html>
