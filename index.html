<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Lista</title>

<style>
  * {
    box-sizing: border-box;
  }

  :root {
    --green: #16a34a;
    --green-dark: #15803d;
    --green-soft: #dcfce7;
    --background: #f6f8f7;
    --card: #ffffff;
    --text: #18201c;
    --muted: #6b7280;
    --border: #e5e7eb;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: var(--background);
    color: var(--text);
  }

  header {
    background: linear-gradient(135deg, #15803d, #22c55e);
    color: white;
    padding: 38px 20px 54px;
    text-align: center;
    border: none;
  }

  h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.8px;
  }

  .subtitle {
    margin-top: 8px;
    color: rgba(255,255,255,0.88);
    font-size: 15px;
  }

  main {
    max-width: 650px;
    margin: -24px auto 40px;
    padding: 0 16px;
  }

  .add-box {
    display: flex;
    gap: 9px;
    padding: 10px;
    margin-bottom: 26px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.10);
  }

  input {
    flex: 1;
    min-width: 0;
    padding: 15px 14px;
    border: none;
    border-radius: 12px;
    background: #f3f4f6;
    font-size: 16px;
    outline: none;
    color: var(--text);
  }

  input:focus {
    background: white;
    box-shadow: inset 0 0 0 2px var(--green);
  }

  .add-button {
    border: none;
    border-radius: 12px;
    padding: 14px 18px;
    background: var(--green);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .add-button:active {
    transform: scale(0.97);
    background: var(--green-dark);
  }

  .category {
    margin-bottom: 22px;
  }

  .category-title {
    font-size: 17px;
    font-weight: 800;
    margin: 0 0 9px 5px;
    color: #374151;
  }

  .list {
    background: var(--card);
    border-radius: 18px;
    padding: 5px 12px;
    box-shadow: 0 3px 16px rgba(0,0,0,0.06);
    border: 1px solid rgba(0,0,0,0.03);
    overflow: hidden;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 42px 10px;
    font-size: 16px;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 62px;
    padding: 10px 3px;
    border-bottom: 1px solid var(--border);
  }

  .item:last-child {
    border-bottom: none;
  }

  .item span {
    flex: 1;
    font-size: 17px;
    font-weight: 500;
  }

  .check-button {
    flex-shrink: 0;
    border: 2px solid #d1d5db;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    background: white;
    color: white;
    cursor: pointer;
    font-size: 19px;
    font-weight: bold;
  }

  .item:has(.completed) .check-button {
    border-color: var(--green);
    background: var(--green);
  }

  .delete-button {
    border: none;
    background: transparent;
    color: #9ca3af;
    cursor: pointer;
    font-size: 18px;
    padding: 8px;
  }

  .completed {
    text-decoration: line-through;
    color: #9ca3af;
  }

  .category-name {
    color: var(--muted);
    font-size: 13px;
    margin-left: 5px;
  }

  @media (max-width: 480px) {
    header {
      padding-top: 30px;
      padding-bottom: 48px;
    }

    h1 {
      font-size: 29px;
    }

    main {
      padding: 0 12px;
    }

    .add-box {
      gap: 7px;
      padding: 8px;
    }

    .add-button {
      padding: 13px 15px;
    }
  }
</style>
</head>

<body>

  <header>
    <h1>🛒 Nuestra Lista</h1>
    <div class="subtitle">La compra, juntos y sin olvidos.</div>
  </header>

  <main>

    <div class="add-box">
      <input
        type="text"
        id="productInput"
        placeholder="¿Qué necesitamos?"
        onkeydown="handleKey(event)"
      >

      <button class="add-button" onclick="addProduct()">
        Añadir
      </button>
    </div>

    <div id="shoppingList"></div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
   
const SUPABASE_URL = "https://hnytuqklpuhiqeapkykx.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZcuVEC6cwbsS8kkop6oLxw_f6XVDtgN
";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
     let products = JSON.parse(localStorage.getItem("nuestraLista")) || [];
    function getCategory(product) {
      const text = product.toLowerCase();

      if (
        text.includes("leche") ||
        text.includes("yogur") ||
        text.includes("yogurt") ||
        text.includes("queso") ||
        text.includes("mantequilla") ||
        text.includes("nata")
      ) {
        return "🥛 Lácteos";
      }

      if (
        text.includes("pollo") ||
        text.includes("carne") ||
        text.includes("ternera") ||
        text.includes("cerdo") ||
        text.includes("hamburguesa") ||
        text.includes("salchicha")
      ) {
        return "🥩 Carnicería";
      }

      if (
        text.includes("pescado") ||
        text.includes("atún") ||
        text.includes("atun") ||
        text.includes("salmón") ||
        text.includes("salmon") ||
        text.includes("gamba") ||
        text.includes("marisco")
      ) {
        return "🐟 Pescadería";
      }

      if (
        text.includes("manzana") ||
        text.includes("plátano") ||
        text.includes("platano") ||
        text.includes("naranja") ||
        text.includes("pera") ||
        text.includes("tomate") ||
        text.includes("lechuga") ||
        text.includes("patata") ||
        text.includes("cebolla") ||
        text.includes("zanahoria")
      ) {
        return "🍎 Fruta y verdura";
      }

      if (
        text.includes("pan") ||
        text.includes("barra") ||
        text.includes("croissant") ||
        text.includes("magdalena")
      ) {
        return "🥖 Panadería";
      }

      if (
        text.includes("agua") ||
        text.includes("coca") ||
        text.includes("refresco") ||
        text.includes("zumo") ||
        text.includes("cerveza")
      ) {
        return "🥤 Bebidas";
      }

      if (
        text.includes("detergente") ||
        text.includes("lejía") ||
        text.includes("lejia") ||
        text.includes("lavavajillas") ||
        text.includes("suavizante") ||
        text.includes("limpiador") ||
        text.includes("papel higiénico") ||
        text.includes("papel higienico")
      ) {
        return "🧽 Limpieza y hogar";
      }

      return "🛍️ Otros";
    }

    function saveProducts() {
      localStorage.setItem("nuestraLista", JSON.stringify(products));
    }

    function renderList() {
      const list = document.getElementById("shoppingList");

      list.innerHTML = "";

      if (products.length === 0) {
        list.innerHTML = `
          <div class="list">
            <div class="empty">
              Tu lista está vacía 🛒
            </div>
          </div>
        `;
        return;
      }

      const categories = {};

      products.forEach((product, index) => {
        const category = getCategory(product.name);

        if (!categories[category]) {
          categories[category] = [];
        }

        categories[category].push({
          product,
          index
        });
      });

      Object.keys(categories).forEach(category => {

        const categoryBox = document.createElement("div");
        categoryBox.className = "category";

        categoryBox.innerHTML = `
          <div class="category-title">
            ${category}
          </div>
          <div class="list"></div>
        `;

        const categoryList = categoryBox.querySelector(".list");

        categories[category].forEach(({ product, index }) => {

          const item = document.createElement("div");
          item.className = "item";

          item.innerHTML = `
            <button class="check-button" onclick="toggleProduct(${index})">
              ${product.completed ? "✓" : ""}
            </button>

            <span class="${product.completed ? "completed" : ""}">
              ${escapeHtml(product.name)}
            </span>

            <button class="delete-button" onclick="deleteProduct(${index})">
              🗑️
            </button>
          `;

          categoryList.appendChild(item);
        });

        list.appendChild(categoryBox);
      });
    }

    function addProduct() {
      const input = document.getElementById("productInput");
      const name = input.value.trim();

      if (name === "") {
        return;
      }

      products.push({
        name: name,
        completed: false
      });

      saveProducts();
      renderList();

      input.value = "";
      input.focus();
    }

    function toggleProduct(index) {
      products[index].completed = !products[index].completed;

      saveProducts();
      renderList();
    }

    function deleteProduct(index) {
      products.splice(index, 1);

      saveProducts();
      renderList();
    }

    function handleKey(event) {
      if (event.key === "Enter") {
        addProduct();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    renderList();
  </script>

</body>
</html>
